name: yabiladi-docker-admin

# Komodo is the Docker administration console for this host. It replaces
# Dozzle's live container logs and CPU/memory view. Periphery owns the Docker
# socket because it performs the host administration requested by Komodo.
#
# Deployment: bash docker-admin/scripts/deploy.sh. This project does not pull
# code or control any application project.

x-docker-logs: &docker-logs
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  komodo-mongo:
    profiles: ["komodo-core"]
    image: mongo:7.0
    command: ["--quiet", "--wiredTigerCacheSizeGB", "0.25"]
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${KOMODO_DATABASE_USERNAME:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${KOMODO_DATABASE_PASSWORD:-}
    volumes:
      - komodo_mongo_data:/data/db
      - komodo_mongo_config:/data/configdb
    networks:
      - app
    logging: *docker-logs

  komodo-core:
    profiles: ["komodo-core"]
    image: ghcr.io/moghtech/komodo-core:2.3.4
    restart: unless-stopped
    init: true
    depends_on:
      komodo-mongo:
        condition: service_started
    env_file:
      - path: ../docker/legacy/komodo.env
        required: false
    environment:
      KOMODO_DATABASE_ADDRESS: komodo-mongo:27017
      KOMODO_DATABASE_USERNAME: ${KOMODO_DATABASE_USERNAME:-admin}
      KOMODO_DATABASE_PASSWORD: ${KOMODO_DATABASE_PASSWORD:-}
      KOMODO_HOST: ${KOMODO_HOST:-https://komodo-imouzzer.yabiladi.com}
      KOMODO_FIRST_SERVER_NAME: ${KOMODO_FIRST_SERVER_NAME:-Imouzzer}
      KOMODO_LOCAL_AUTH: ${KOMODO_LOCAL_AUTH:-true}
      KOMODO_INIT_ADMIN_USERNAME: ${KOMODO_INIT_ADMIN_USERNAME:-}
      KOMODO_INIT_ADMIN_PASSWORD: ${KOMODO_INIT_ADMIN_PASSWORD:-}
      KOMODO_PORT: "9120"
    ports:
      - "127.0.0.1:9120:9120"
    volumes:
      - komodo_keys:/config/keys
      - komodo_backups:/backups
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=yabiladi_app"
      - "traefik.http.routers.komodo.rule=Host(`${KOMODO_HOSTNAME:-komodo-imouzzer.yabiladi.com}`) || Host(`komodo.yabiladi.com`) || Host(`komodo-imouzzer.yabiladi.com`)"
      - "traefik.http.routers.komodo.entrypoints=websecure"
      - "traefik.http.routers.komodo.tls=true"
      - "traefik.http.routers.komodo.tls.certresolver=${KOMODO_CERT_RESOLVER-letsencrypt}"
      - "traefik.http.routers.komodo.priority=10"
      - "traefik.http.routers.komodo.middlewares=komodo-htpasswd"
      - "traefik.http.routers.komodo-bootstrap.rule=(Host(`${KOMODO_HOSTNAME:-komodo-imouzzer.yabiladi.com}`) || Host(`komodo.yabiladi.com`) || Host(`komodo-imouzzer.yabiladi.com`)) && (Path(`/auth/login/LoginLocalUser`) || Path(`/read/ListOnboardingKeys`) || Path(`/write/CreateOnboardingKey`) || Path(`/write/UpdateOnboardingKey`) || Path(`/ws/periphery`))"
      - "traefik.http.routers.komodo-bootstrap.entrypoints=websecure"
      - "traefik.http.routers.komodo-bootstrap.priority=100"
      - "traefik.http.routers.komodo-bootstrap.tls=true"
      - "traefik.http.routers.komodo-bootstrap.tls.certresolver=${KOMODO_CERT_RESOLVER-letsencrypt}"
      - "traefik.http.routers.komodo-bootstrap.service=komodo"
      - "traefik.http.middlewares.komodo-htpasswd.basicauth.usersfile=/etc/traefik/htpasswd/user_yabiladi"
      - "traefik.http.middlewares.komodo-htpasswd.basicauth.removeheader=true"
      - "traefik.http.services.komodo.loadbalancer.server.port=9120"
    networks:
      - app
    logging: *docker-logs

  komodo-periphery:
    profiles: ["komodo-periphery"]
    image: ghcr.io/moghtech/komodo-periphery:2.3.4
    restart: unless-stopped
    init: true
    environment:
      PERIPHERY_ROOT_DIRECTORY: /etc/komodo
      PERIPHERY_DISABLE_TERMINALS: "true"
      PERIPHERY_DISABLE_CONTAINER_TERMINALS: "true"
      PERIPHERY_SERVER_ENABLED: ${PERIPHERY_SERVER_ENABLED:-false}
      PERIPHERY_CORE_ADDRESS: ${PERIPHERY_CORE_ADDRESS:-}
      PERIPHERY_CONNECT_AS: ${PERIPHERY_CONNECT_AS:-Imouzzer}
      PERIPHERY_ONBOARDING_KEY_FILE: /run/secrets/komodo-onboarding-key
      PERIPHERY_CORE_PUBLIC_KEYS: file:/config/keys/core.pub
      PERIPHERY_CONTAINER_STATS_POLLING_RATE: "5-sec"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /proc:/proc
      - /etc/komodo:/etc/komodo
      - ../docker/legacy/komodo-onboarding-${YABILADI_NODE:-local}.key:/run/secrets/komodo-onboarding-key:ro
      - komodo_keys:/config/keys
    networks:
      - app
    logging: *docker-logs

volumes:
  komodo_mongo_data:
    external: true
    name: yabiladi_komodo_mongo_data
  komodo_mongo_config:
    external: true
    name: yabiladi_komodo_mongo_config
  komodo_backups:
    external: true
    name: yabiladi_komodo_backups
  komodo_keys:
    external: true
    name: yabiladi_komodo_keys

networks:
  app:
    external: true
    name: yabiladi_app

          description: >-
            Une ligne « panic: », « fatal: », un core dump ou une mort anormale sont
            apparus sur le flux stdout de traefik dans les 10 dernières minutes.
            Traefik est la seule porte d'entrée HTTPS de la pile : une panique dans
            un routeur peut laisser le conteneur Up avec une partie des hôtes
            injoignable, ce que « container-traefik-down » ne voit pas.
            Voir la ligne exacte : docker compose logs --since 15m traefik | grep -Ei
            'panic:|fatal:'
            Contrôle des routeurs : docker compose exec -T traefik traefik validateConfiguration


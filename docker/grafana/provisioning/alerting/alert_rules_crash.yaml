        annotations:
          summary: 'Conteneur nginx : worker tué par un signal, ou fichier de configuration refusé'
          description: >-
            Une ligne « [emerg] », un worker mort sur SIGSEGV/SIGABRT/SIGBUS/SIGKILL,
            ou un core dump sont apparus sur le flux stdout du conteneur nginx dans
            les 10 dernières minutes. Un « [emerg] » signifie que la configuration
            est refusée : nginx tourne encore sur l'ancienne, ou ne s'est pas
            rechargé, et le conteneur reste Up. Mesuré le 2026-11-15 sur sept
            jours : 6 lignes « emerg », toutes des refus de configuration pendant
            un déploiement (valeur non résolue « ${YB_FPM_KEEPALIVE:-32} »,
            parenthèse manquante dans une regex, « try_files » mal argumenté).
            Voir la ligne exacte : docker compose logs --since 15m nginx | grep -i emerg
            Contrôle : docker compose exec -T nginx nginx -t
            Recharge après correction : docker compose exec -u root nginx kill -s USR2 1


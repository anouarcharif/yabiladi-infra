            Une ligne « FATAL ERROR », « heap out of memory », un core dump ou une
            mort anormale sont apparus sur le flux stdout de dbackup dans les 10
            dernières minutes. Le conteneur peut rester Up avec un agent incapable
            de lancer les jobs 04:00-04:28 : un job qui ne démarre pas n'est pas un
            job en échec, et les alertes de job ne le voient pas.
            MOTIF NON CONTREVÉRIFIÉ : aucun crash de dbackup n'existe dans
            l'historique Loki (0 ligne sur sept jours pour tous les marqueurs
            testés), donc le motif retenu est celui du runtime Node/V8, pas une
            trace observée ici. Les autres motifs de cette page sont calibrés sur
            des lignes réelles.
            Voir la ligne exacte : docker compose logs --since 15m dbackup | grep -Ei
            'FATAL ERROR|heap out of memory'
            Contrôle des jobs : API DBackup /api/jobs (sonde documentée dans
            tools/backup), puis la file du serveur.

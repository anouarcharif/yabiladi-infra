        for: 0m
        labels:
          severity: critical
          team: infrastructure
          container: stalwart
          signal: crash
        annotations:
          summary: 'Conteneur stalwart : une ligne de niveau erreur est apparue'
          description: >-
            Le sélecteur porte sur « detected_level », l'étiquette que Loki dérive
            du jeton de niveau en tête de ligne (mesuré le 2026-11-19 : les
            flux du relai arrivent étiquetés « info », avec la même étiquette
            sur tous les conteneurs). Le motif ancre donc sur le NIVEAU et non
            sur le mot : la même après-midi, une remise en échec s'écrivait en
            INFO avec « failed » dans son texte — un « (?i)error » aurait sonné
            sur chaque rebond normal.
            Ce que la règle ne voit pas : un panic Rust écrit hors du traceur
            n'aurait pas de niveau détecté. Stalwart est un seul processus, ce
            panic-là le tue, et « container-stalwart-down » le dit dans les deux
            minutes.
            Voir la ligne exacte : docker compose logs --since 15m stalwart
            (dépôt /opt/yabiladi-mailer, pas ici).


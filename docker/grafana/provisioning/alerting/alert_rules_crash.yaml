          description: >-
            Une ligne de crash est sortie du flux stdout du conteneur manticore dans
            les 10 dernières minutes. Cas réel du 2026-11-15 : le worker Buddy meurt
            en boucle (« Worker::report_error(): worker(pid=38, id=0) abnormal exit,
            status=255 », précédé de « PHP Fatal error: Uncaught ErrorException:
            fopen(/dev/stdout) ») alors que searchd répond sur 9308/sql et que le
            conteneur reste Up. Conséquence mesurée : /metrics et /api/v2/search ne
            répondent plus (404 et 501), la recherche de forum par /sql continue de
            fonctionner.
            Voir la ligne exacte : docker compose logs --since 15m manticore | grep -Ei
            'abnormal exit|PHP Fatal error|panic:'
            Distinguer les deux : le daemon vit-il ?
            docker compose exec -T php php -r 'echo @file_get_contents("http://manticore:9308/sql?mode=raw&query=SHOW%20STATUS") ? "daemon vivant" : "daemon muet";'
            Buddy vit-il ? docker compose exec -T manticore wget -qO- http://localhost:9308/api/v2/sql (501 = Buddy mort).
            Cause connue du crash Buddy : « log = /dev/stdout » dans
            docker/manticore/manticore.conf — CrashDetector relit ce chemin en
            lecture, /dev/stdout est un pipe en écriture seule dans le conteneur.
            Redémarrage : docker compose up -d manticore.


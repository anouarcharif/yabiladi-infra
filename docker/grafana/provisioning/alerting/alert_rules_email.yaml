apiVersion: 1

# Règles d'alerte sur les envois du relai Stalwart (emails sortants).
#
# D'OÙ VIENNENT LES MOTIFS. Le 2026-11-19, le relai a quitté ce dépôt pour le
# projet « yabiladi-mailer » (Stalwart), et les cinq règles ci-dessous ont été
# réécrites contre les lignes que CE serveur écrit vraiment. La forme mesurée
# (sonde locale du 2026-11-19, destinataire en « .invalid », puis un 550 réel de
# Google contre l'IP du poste de développement) :
#
#   … INFO Queued message for delivery (queue.message-queued) … queueId = 3414…,
#     from = "webmaster@yabiladi.com", to = ["sonde@domaine-….invalid"], size = 503,
#     nextRetry = …, nextDsn = …, expires = …
#   … INFO MX record lookup failed (delivery.mx-lookup-failed) … domain = "domaine-….invalid",
#     details = "No MX records were found, attempting implicit MX.", elapsed = 0ms
#   … INFO DSN permanent failure notification (delivery.dsn-perm-fail) …
#     to = "sonde@domaine-….invalid", hostname = "…", details = "…", total = 0
#   … INFO Message rejected by remote server (delivery.message-rejected) …
#     hostname = "aspmx.l.google.com", code = 550, details = "… 5.7.1 …"
#   … INFO DSN permanent failure notification (delivery.dsn-perm-fail) … details =
#     "Unexpected response for BDAT 4647 LAST: Code: 550, Enhanced code: 5.7.1, Message: …"
#   … INFO Discarding message after double bounce (delivery.double-bounce) …
#
# C'est-à-dire : « horodatage NIVEAU texte (nom.evenement) cle = valeur, … ». Une
# ligne par événement, pas de JSON (le traceur Stdout n'a aucun champ « format »).
# Les motifs « status=bounced », « status=deferred » et « delay= » de l'ère
# Postfix ne transposent pas : ils ne sont pas réutilisables ici, et les remplacements
# sont choisis événement par événement, pas traduit mot à mot.
#
# POURQUOI DES MOTIFS « |= » ET PAS DES « |~ » À PARENTHÈSES ÉCHAPPÉES. Le nom
# d'événement est entouré de parenthèses dans la ligne, et LogQL refuse
# « \( » dans une chaîne : mesuré le 2026-11-19 sur le Loki de la pile,
# « {service="stalwart"} |~ "\(delivery\.dsn-perm-fail\)" » répond
# « parse error at line 1, col 25: invalid char escape » — la règle ne serait
# pas fausse, elle serait MORTE à l'exécution (et « execErrState: OK » s'en
# tairait). D'où le filtre de sous-chaîne « |= "delivery.dsn-perm-fail" », qui
# attrape le nom avec ses deux parenthèses sans jamais les demander au
# compilateur. Les six expressions de ce fichier ont été jouées contre Loki le
# 2026-11-19 sur la sonde décrite plus haut : la règle de politique rend 1,
# celle de volume 1, le double rebond 1, et le groupage par domaine rend
# exactement « domaine-inexistant-20261119.invalid » et « yabiladi.com ».
# Rejouées le 2026-11-19 sur l'instance réelle : les six compilent, quatre
# rendent des lignes (1, 2, 4 et le groupage), les deux dernières rendent 0
# parce que ni « dsn-temp-fail » ni « connect-error » ne sont écrits sur ce
# poste en trois jours — un 0 qui n'a pas la même cause qu'une règle morte est
# vérifié par le contrôle du README (§ « une règle morte ne dit rien »).
#
# POURQUOI « | domain=~".+" » APRÈS L'EXTRACTION. « | regexp » n'est PAS un
# filtre : mesuré, {service="stalwart"} | regexp "(?P<evenement>delivery.[a-z-]+)"
# rend 3 110 lignes sur ce poste alors que 62 seulement portent un événement
# « delivery. ». Le stage ajoute une étiquette aux lignes qui matchent et
# LAISSE PASSER les autres, qui se retrouvent dans un groupe sans étiquette.
# Sans garde, un « sum by (domain) » peut donc franchir le seuil dans une
# série « domain="" » et annoncer « Le domaine  rejette nos messages ». Le
# pipe après l'extraction écarte ce groupe (il est sans effet sur le jeu réel :
# les 21 lignes « dsn-perm-fail » portent toutes un « to = "…" »).
#
# CE QUE CES RÈGLES NE PEUVENT PAS VOIR, et qui a coûté une règle. Deux trous sont
# structurels, pas des oublis :
#   - aucune jauge de file. Mesuré dans le rendu Prometheus du serveur : aucun nom
#     contenant « queue », « out » ni « message ». La profondeur de la file différée
#     ne se lit donc ni ici ni dans un tableau de bord ; « postqueue -p » n'existe
#     pas non plus. La règle d'ÂGE du message (« delay= », l'accumulé Postfix) est
#     morte pour cette raison : Stalwart écrit des échéances (« nextRetry »,
#     « expires »), jamais un âge cumulé, et rien ne renouvelle une ligne pendant
#     qu'un message dort. Elle est remplacée par la règle de DOUBLE REBOND, qui
#     signe la même panne à son terme — le message est perdu et personne ne le sait.
#   - les compteurs de remise Prometheus ne portent AUCUNE étiquette de domaine.
#     Le seul endroit où un domaine destinataire existe est la ligne de journal,
#     d'où la règle « email-rebond-domaine » jouée sur Loki avec une extraction,
#     et non sur un « sum by (domain) ».
#
# POURQUOI « 5.7. » A ENCORE UN SEUIL DE ZÉRO. 5.7.x est la classe « politique de
# sécurité » du destinataire : IP non autorisée par SPF, DMARC en échec, message
# refusé comme spam, relais non accepté. Un seul de ces rejets vient de notre
# configuration ou de notre réputation. Le motif porte sur la ligne
# « delivery.dsn-perm-fail » parce que c'est là que le code étendu est écrit :
# mesuré, « details = "… Enhanced code: 5.7.1, Message: …" ». La ligne sœur
# « delivery.message-rejected » porte « code = 550 » sans code étendu, elle ne
# serait pas filtrable par classe.
#
# POURQUOI UN SEUIL DE VOLUME À CINQ. Un ou deux 5.1.1 par jour sont normaux
# (adresse saisie de travers dans un formulaire). Au-delà de cinq en un quart
# d'heure, c'est une liste ou un lot. Le seuil est un choix d'exploitation, pas
# une mesure.
#
# LE DOSSIER. « Applications » est créé par le fournisseur de tableaux de bord
# (docker/grafana/provisioning/dashboards/logging.yaml) ; c'est le nom qu'attend
# « folder: » ici, jamais un folderUid (voir README.md, mesures sur 13.3.0).
#
# FANTÔMES. Le provisioning est un upsert, pas une synthèse (README, § « Retirer
# un fichier ne retire pas ses règles ») : « email-defere-age » et
# « email-defere-volume » survivraient à leur réécriture sous leurs anciens UID,
# l'une sur un motif qui ne s'écrit plus, l'autre avec un seuil hérité. Elles sont
# supprimées par « deleteRules » ci-dessous.
deleteRules:
  - orgId: 1
    uid: email-defere-age
  - orgId: 1
    uid: email-defere-volume

groups:
  - orgId: 1
    name: emails-sortants
    folder: 'Applications'
    interval: 1m
    rules:
      # ---------------------------------------------------------------------
      # Rejet pour politique ou authentification : la classe 5.7.x. C'est la
      # règle qui aurait sonné le jour du test vers Gmail depuis le poste de
      # développement — mesuré le 2026-11-19, elle sonne vraiment :
      # « Enhanced code: 5.7.1 … The IP you're using to send mail is not
      # authorized ».
      # ---------------------------------------------------------------------
      - uid: email-rebond-politique
        title: Emails — rejet définitif pour politique ou authentification
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: yabiladi-loki
            model:
              datasource: { type: loki, uid: yabiladi-loki }
              expr: 'sum(count_over_time({service="stalwart"} |= "delivery.dsn-perm-fail" |= "code: 5.7." [15m]))'
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  query: { params: [B, 0, last] }
                  operator: { type: and }
                  reducer: { type: now, params: [] }
                  evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: OK
        for: 0m
        labels:
          severity: critical
          team: email
        annotations:
          summary: Un destinataire refuse nos messages pour politique ou authentification
          description: >-
            Le MX a répondu 5.7.x : IP non autorisée (SPF), DMARC en échec, ou
            message classé indésirable. La ligne complète — le texte du serveur,
            qui dit lequel des trois — se lit dans le dashboard « Emails
            sortants » (panneau « Rejets définitifs »), ou en direct :
            « docker compose logs --since 30m stalwart | grep dsn-perm-fail »
            dans /opt/yabiladi-mailer. Vérifier ensuite, dans cet ordre :
            l'hélice du relai (./deploy.sh --check puis --verify dans ce même
            dépôt, qui rendent le nom publié, l'écouteur et l'empreinte de la clé
            DKIM), l'alignement de l'enveloppe (le site impose
            webmaster@yabiladi.com par framework.mailer.envelope.sender), et le
            verdict SPF/DKIM/DMARC d'un envoi de test
            (docker compose exec -T php php bin/console mailer:test <adresse>
            --from=webmaster@yabiladi.com, dans le dépôt du site). Un 5.7.1
            accompagné de « not authorized » vient de l'IP ou du SPF, pas du
            contenu.
      # ---------------------------------------------------------------------
      # Volume : tous les rejets définitifs, classe confondue.
      # ---------------------------------------------------------------------
      - uid: email-rebond-volume
        title: Emails — plus de cinq rejets définitifs en quinze minutes
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: yabiladi-loki
            model:
              datasource: { type: loki, uid: yabiladi-loki }
              expr: 'sum(count_over_time({service="stalwart"} |= "delivery.dsn-perm-fail" [15m]))'
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  query: { params: [B, 0, last] }
                  operator: { type: and }
                  reducer: { type: now, params: [] }
                  evaluator: { type: gt, params: [5] }
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
          team: email
        annotations:
          summary: Plus de cinq rejets définitifs en un quart d'heure
          description: >-
            Trop de messages sont refusés pour que ce soit le hasard d'une
            adresse mal saisie. Regarder « Codes SMTP des rejets » et le
            panneau par domaine dans le dashboard : si la classe dominante est
            5.1.x, un lot contient des adresses mortes (newsletter, formulaire) ;
            si c'est 5.7.x, voir la règle de politique. Un pic isolé après un
            envoi de masse est normal sur quelques adresses ; le même pic qui se
            répète à chaque lot ne l'est pas. Une ligne n'est pas un message :
            Stalwart en écrit une par destinataire, comme Postfix.
      # ---------------------------------------------------------------------
      # Un domaine destinataire qui refuse systématiquement : c'est ainsi
      # qu'apparaît un blocage de réputation (Yahoo, Outlook) avant qu'il ne
      # touche tous les destinataires.
      # ---------------------------------------------------------------------
      - uid: email-rebond-domaine
        title: Emails — un domaine destinataire rejette nos messages
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: yabiladi-loki
            model:
              datasource: { type: loki, uid: yabiladi-loki }
              expr: 'sum by (domain) (count_over_time({service="stalwart"} |= "delivery.dsn-perm-fail" | regexp "to = \"[^\"]*@(?P<domain>[^\"@]+)\"" | domain=~".+" [15m]))'
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  query: { params: [B, 0, last] }
                  operator: { type: and }
                  reducer: { type: now, params: [] }
                  evaluator: { type: gt, params: [3] }
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
          team: email
        annotations:
          summary: Le domaine {{ $labels.domain }} rejette plus de trois messages en un quart d'heure
          description: >-
            Plusieurs destinataires d'un même domaine refusent nos messages :
            c'est la signature d'un blocage côté destinataire (réputation de
            l'IP ou du domaine), pas d'adresses fausses une par une. Le domaine
            est extrait du champ « to = "…" » de la ligne, qui vient après
            « from = » : une extraction qui partirait du premier « @ » de la
            ligne rendrait NOTRE domaine, pas celui du destinataire (mesuré sur
            la ligne du 2026-11-19). Lire le texte du 550 dans « Rejets
            définitifs » : « TSS04 » ou « blocked » chez Yahoo, « 5.7.26 » ou
            « spam » chez Gmail, « 5.7.1 not authorized » renvoie à l'IP et au
            SPF. Un déblocage se demande au POSTMASTER du destinataire ou à
            l'hébergeur, pas dans ce dépôt ; entre-temps, un envoi de masse vers
            ce domaine est à suspendre plutôt qu'à répéter, chaque rejet
            aggravant la réputation.
      # ---------------------------------------------------------------------
      # Le double rebond : le message est mort ET son avis de retour est mort
      # aussi. C'est la panne que la règle d'âge couvrait chez Postfix — voir
      # l'en-tête pour pourquoi l'âge n'est plus mesurable ici.
      # ---------------------------------------------------------------------
      - uid: email-double-bounce
        title: Emails — un message perdu n'a même pas pu prévenir son expéditeur
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: yabiladi-loki
            model:
              datasource: { type: loki, uid: yabiladi-loki }
              expr: 'sum(count_over_time({service="stalwart"} |= "delivery.double-bounce" [15m]))'
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  query: { params: [B, 0, last] }
                  operator: { type: and }
                  reducer: { type: now, params: [] }
                  evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: OK
        for: 0m
        labels:
          severity: critical
          team: email
        annotations:
          summary: Un rebut a été jeté après un second échec (double rebond)
          description: >-
            « delivery.double-bounce » (mesuré : « Discarding message after
            double bounce ») veut dire que le destinataire était injoignable ET
            que l'avis de retour, adressé à l'enveloppe d'envoi, a été refusé à
            son tour. Le message est perdu sans que personne n'en soit prévenu.
            Sur nos envois applicatifs, l'enveloppe est
            webmaster@yabiladi.com (framework.mailer.envelope.sender) : un double
            rebond signifie donc le plus souvent que Google/le MX de
            yabiladi.com refuse notre IP — exactement ce que la règle de
            politique attrape en amont. Les deux lignes (le rebut et son motif)
            se lisent ensemble : « docker compose logs --since 30m stalwart |
            grep -E "dsn-perm-fail|double-bounce" » dans /opt/yabiladi-mailer.
      # ---------------------------------------------------------------------
      # La file qui grossit : les remises temporaires. Deux événements, lus
      # dans la taxonomie du binaire (550 noms, « delivery. » 38), jamais
      # observés sur CETTE machine faute de destinataire qui engris-liste :
      # au premier pic, vérifier que le nom sort bien avant de croire la règle
      # verte.
      # ---------------------------------------------------------------------
      - uid: email-temp-fail-volume
        title: Emails — plus de trente remises temporaires en quinze minutes
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: yabiladi-loki
            model:
              datasource: { type: loki, uid: yabiladi-loki }
              expr: 'sum(count_over_time({service="stalwart"} |~ "delivery[.](dsn-temp-fail|connect-error)" [15m]))'
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  query: { params: [B, 0, last] }
                  operator: { type: and }
                  reducer: { type: now, params: [] }
                  evaluator: { type: gt, params: [30] }
        noDataState: OK
        execErrState: OK
        for: 5m
        labels:
          severity: warning
          team: email
        annotations:
          summary: "La file grossit : plus de trente remises temporaires en un quart d'heure"
          description: >-
            Ce compteur additionne les LIGNES de tentative, pas les messages :
            une remise qui échoue écrit une ligne par destinataire. Un pic qui
            retombe seul est un gris-listing ou un MX momentanément sourd ; un
            pic qui dure veut dire que le 25 SORTANT est coupé chez l'hébergeur,
            que le DNS ne résout plus (« delivery.mx-lookup-failed », qui lui
            précède normalement ces lignes) ou que l'IP est sur une liste. Ce
            que la règle ne dit PAS : combien de messages dordent, parce
            qu'aucune jauge de file n'existe côté Stalwart (en-tête de ce
            fichier). Les événements de la famille « queue. » portent leurs
            échéances (« nextRetry », « expires ») : c'est là que se lit, à la
            main, combien de messages dorment et jusqu'à quand ils seront
            rejoués.
      # ---------------------------------------------------------------------
      # La signature DKIM sortante, côté écriture. Nouvelle règle : Postfix
      # rendait l'état du milter par un fichier (/run/opendkim.state) et un
      # état de santé ; Stalwart signe à l'entrée sur le port 2525 et n'expose
      # rien d'équivalent.
      # ---------------------------------------------------------------------
      - uid: email-dkim-signature
        title: Emails — la signature DKIM sortante a échoué
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: yabiladi-loki
            model:
              datasource: { type: loki, uid: yabiladi-loki }
              expr: 'sum(count_over_time({service="stalwart"} |~ "dkim2?[.](build-error|signer-not-found|signing-failed|public-key-error|recipe-error|signature-invalid|custody-broken|timestamp-invalid)" [15m]))'
              queryType: instant
              refId: A
          - refId: B
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              refId: C
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - type: query
                  query: { params: [B, 0, last] }
                  operator: { type: and }
                  reducer: { type: now, params: [] }
                  evaluator: { type: gt, params: [0] }
        noDataState: OK
        execErrState: OK
        for: 0m
        labels:
          severity: critical
          team: email
        annotations:
          summary: Le relai n'a pas pu signer un message sortant
          description: >-
            Le domaine yabiladi.com est en DMARC « p=quarantine pct=100 » : un
            message qui part sans signature DKIM alignée va en spam, sans que le
            destinataire ne dise pourquoi. Les noms sélectionnés sont ceux de la
            FAMILLE qui écrit la signature (dkim. et dkim2. — compter les deux,
            une règle « dkim.* » est aveugle aux 13 événements de « dkim2. »,
            mesuré dans la taxonomie du binaire). L'alternance est écrite en
            « dkim2?[.] » et non « (dkim|dkim2). » : le point non échappé est un
            joker, et la leçon du panneau « Tentatives de remise » est fraîche —
            un « delivery. » sans crochet de protection a fait apparaître
            « queueId » comme un nom d'événement (62 lignes mesurées).
            « signer-not-found » et « signing-failed » sont entrés le 2026-11-20
            après relevé du binaire : les deux noms existent («
            dkim.signer-not-found », « dkim2.signing-failed ») et décrivent
            l'écriture par le relai — un objet Dkim disparu du plan fait
            exactement « signer-not-found », et l'alternance d'avant ne le
            voyait pas. Les autres membres des deux familles (pass, none,
            neutral, fail, hash-mismatch, verification-failed, temp-error,
            perm-error, chain-invalid, envelope-mismatch) sont des verdicts de
            VÉRIFICATION : ils n'ont rien à faire dans une règle qui annonce
            qu'on n'a pas su signer.
            CE QUE CETTE RÈGLE NE DIT PAS : « smtp.dkim-fail » est un échec de
            VÉRIFICATION À L'ENTRÉE, pas un défaut de signature sortante —
            mesuré le 2026-11-19, il sort sur chaque soumission non signée
            (« strict = false, result = [] »), donc l'y brancherait ferait sonner
            le relai en permanence. Contrôle rejoué le 2026-11-20 sur 7 jours de
            ce poste : 10 lignes « smtp.dkim?-fail », 0 ligne « dkim.* ». Et un
            message qui part SANS signature sans que rien ne l'appelle n'a pas
            d'événement : la preuve se fait sur le message reçu
            (« DKIM-Signature: d=yabiladi.com; s=mail2 »), ou par ./deploy.sh
            --check côté Yabiladi-Mailer, qui compare l'empreinte de la clé du
            magasin au TXT publié.

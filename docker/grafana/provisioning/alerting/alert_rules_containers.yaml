      # ---------------------------------------------------------------------
      # Le moteur de recherche du forum. Seul ici à ne publier aucun port :
      # le module Phorum l'atteint par le réseau interne, et ses erreurs sont
      # avalées — une page de résultats vide, en HTTP 200, sans message. Cette
      # règle est donc le seul signal quand il tombe ; le log du module
      # (« sphinx_search: … ») ne dit rien tant que personne ne le lit.
      # ---------------------------------------------------------------------

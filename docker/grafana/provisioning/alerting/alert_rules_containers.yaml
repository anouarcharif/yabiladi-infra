        execErrState: Alerting
        for: 2m
        labels:
          severity: critical
          team: infrastructure
          container: manticore
        annotations:
          summary: 'Conteneur Manticore arrêté'
          description: >-
            Le conteneur manticore n'est plus vu par cAdvisor.
            La recherche du forum (/forum/search.php) rend « Aucun résultat » en HTTP 200,
            sans erreur visible : c'est cette alerte qui le signale.
            Vérifier : docker compose ps manticore ; docker compose logs --since 10m manticore.
            Redémarrage : docker compose up -d manticore.
            La table se reconstruit si le volume est perdu : bin/console app:forum-search:ensure-schema
            puis le DAG forum_search_backfill.

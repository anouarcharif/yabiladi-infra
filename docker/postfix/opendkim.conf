# Gabarit rendu au démarrage par entrypoint.sh (envsubst). OpenDKIM ne
# connaît aucune variable : les ${...} ci-dessous sont tous remplacés, aucun
# ne survit dans le fichier installé.
#
# Le relais signe lui-même. C'est ce qui remplace le rôle qu'OpenDKIM jouait à
# côté du Postfix Debian : il signe tout ce qui passe par le Milter, y compris
# le courrier qui ne vient pas de l'application Symfony (le V1 encore en place
# sur l'autre machine, les shells de l'hôte, les notifications internes), là où
# le signer applicatif de Symfony ne couvre que ses propres messages.

# « no » : le démon n'a pas de /dev/log dans ce conteneur, et un « Syslog oui »
# le rendrait muet. Les lignes restent donc sur son erreur standard, que le
# lancement en avant-plan (-f, voir entrypoint.sh) branche sur les journaux du
# conteneur, donc sur Loki sous service="postfix".
Syslog                  no
SyslogSuccess           no

Mode                    sv
Canonicalization        relaxed/simple

Domain                  ${OPENDKIM_DOMAIN}
Selector                ${OPENDKIM_SELECTOR}
KeyFile                 ${OPENDKIM_KEYFILE}

# Socket TCP sur la boucle locale plutôt qu'un socket de fichier : le démon
# client de Postfix tourne sous l'utilisateur « postfix », qui n'est pas dans
# le groupe « opendkim » — un socket fichier lui serait interdit sans UMask
# abaissée.
Socket                  inet:8891@127.0.0.1
PidFile                 /run/opendkim/opendkim.pid
UserID                  opendkim:opendkim
UMask                   0077

# Les systèmes dont le courrier doit être signé : exactement ceux que Postfix
# autorise à relayer (mynetworks calculées au démarrage : réseaux des interfaces
# du conteneur, plus POSTFIX_RELAY_NETWORKS). Sans cette liste, un message reçu
# par TCP depuis le réseau Docker ou depuis tarourt serait traité comme
# extérieur : vérifié, jamais signé.
#
# Le nom est « InternalHosts » et il porte un FICHIER, pas une liste en ligne.
# La variante en ligne « InternalNetworks » est refusée à l'analyse de la
# configuration (« configuration error at line N: unrecognized parameter »,
# code de sortie 78) — mesuré sur l'image bookworm (opendkim
# 2.11.0~beta2-8+deb12u1), et ce refus-là n'a PAS été rejoué sur la base
# trixie. Ce qui l'a été sur trixie (2.11.0~beta2-9.1+b1), c'est la forme qui
# tient aujourd'hui : la répétition 3.7 → 3.10 sur un même volume a signé avec
# « /run/opendkim.state » à « on » et un « b= » vérifié RSA-SHA256 valide, donc
# rien ici n'a besoin de changer pour la montée. Le fichier s'écrit à chaque
# démarrage par entrypoint.sh, parce que le CIDR du réseau Docker n'est pas
# connu à l'écriture du dépôt.
InternalHosts           /etc/opendkim/internal_hosts
